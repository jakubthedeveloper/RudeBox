[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<synth_engine.cpp>
    +<hit_detector.cpp>
    +<synth_voice.cpp>
    +<output_limiter.cpp>
    +<waveforms.cpp>
    +<math_utils.cpp>
build_flags =
    -std=gnu++17
    -I test/test_audio_signal_path/stubs
